name: rakazo-computer
services:
  computer:
    image: rakazo-computer:local
    build:
      context: .
      args:
        BOT_UID: ${BOT_UID:?Run install.sh first}
        BOT_GID: ${BOT_GID:?Run install.sh first}
    container_name: rakazo-computer
    labels:
      app.owner: rakazo-computer
    init: true
    restart: "on-failure:3"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    shm_size: 256m
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,mode=1777
    environment:
      DISPLAY: :99
      LISTEN_IP: 172.30.160.2
      WORKSPACE: /workspace
      COMPUTER_ALLOWED_HOSTS: ${COMPUTER_ALLOWED_HOSTS:?Run configure-tailnet.py first}
    volumes:
      - ./workspace:/workspace:rw,Z
    ports:
      - "127.0.0.1:16080:8080"
      - "${TAILSCALE_IP:?Run configure-tailnet.py first}:16080:8080"
    networks:
      computer:
        ipv4_address: 172.30.160.2
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://172.30.160.2:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
networks:
  computer:
    name: rakazo_computer
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-rakazo-cmp
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
    ipam:
      config:
        - subnet: 172.30.160.0/24
