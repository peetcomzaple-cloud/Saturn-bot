<!doctype html>
<!-- Modified for Saturn bot branding; upstream notices are retained. See PROVENANCE.md. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your team of always-on agents." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-title" content="Saturn bot" />
    <link rel="icon" href="/saturn-favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/saturn-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Saturn bot</title>
    <script>
      (() => {
        const key = "rakazo.uiAppearance";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "system" || stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const systemLight =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
        const theme = preference === "system" ? (systemLight ? "light" : "dark") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fafaf8" : "#0b0c0e");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
